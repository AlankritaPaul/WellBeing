<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <!-- Dual-color continuous gradient animation (Yellow and Pink, word stays completely still) -->
    <linearGradient id="wellbeingYellowPinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15">
        <animate attributeName="stop-color" values="#facc15; #ec4899; #fbbf24; #f43f5e; #facc15" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#fb7185">
        <animate attributeName="stop-color" values="#fb7185; #facc15; #ec4899; #fbbf24; #fb7185" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899; #f43f5e; #facc15; #fbbf24; #ec4899" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 84px;
      letter-spacing: -2px;
      fill: url(#wellbeingYellowPinkGrad);
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.3px;
      fill: #0284c7;
    }
    @media (prefers-color-scheme: dark) {
      .tagline {
        fill: #38bdf8;
      }
    }
  </style>

  <!-- Large WellBeing Name with Yellow and Pink Dual Color Gradient -->
  <text x="50%" y="82" text-anchor="middle" class="title">WellBeing</text>

  <!-- Tagline: Thoughtful Technology. Meaningful Healthcare. (Different color, not same as WellBeing) -->
  <text x="50%" y="146" text-anchor="middle" class="tagline">Thoughtful Technology. Meaningful Healthcare.</text>
</svg>