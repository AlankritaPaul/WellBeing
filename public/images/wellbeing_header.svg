<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="100%" height="150">
  <defs>
    <!-- Dual-color continuous gradient animation -->
    <linearGradient id="wellbeingDualGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981; #06b6d4; #3b82f6; #10b981" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4; #3b82f6; #10b981; #06b6d4" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6; #10b981; #06b6d4; #3b82f6" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 68px;
      letter-spacing: -1.5px;
      fill: url(#wellbeingDualGrad);
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.3px;
      fill: #f59e0b;
    }
  </style>

  <!-- Big WellBeing Name with Dual Color Animated Contrast -->
  <text x="50%" y="72" text-anchor="middle" class="title">WellBeing</text>

  <!-- Tagline: A little bit big, different color (warm amber/gold), not same as WellBeing -->
  <text x="50%" y="126" text-anchor="middle" class="tagline">Thoughtful Technology. Meaningful Healthcare.</text>
</svg>
