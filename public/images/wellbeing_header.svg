<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <!-- Dual-color continuous gradient animation (Only color moves, word stays completely still) -->
    <linearGradient id="wellbeingDualGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981; #06b6d4; #3b82f6; #10b981" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4; #3b82f6; #10b981; #06b6d4" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6; #10b981; #06b6d4; #3b82f6" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 84px;
      letter-spacing: -2px;
      fill: url(#wellbeingDualGrad);
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.3px;
      fill: #f59e0b;
    }
  </style>

  <!-- Large WellBeing Name with Dual Color Animated Contrast -->
  <text x="50%" y="82" text-anchor="middle" class="title">WellBeing</text>

  <!-- Tagline: Thoughtful Technology. Meaningful Healthcare. (Larger, distinct warm amber color) -->
  <text x="50%" y="146" text-anchor="middle" class="tagline">Thoughtful Technology. Meaningful Healthcare.</text>
</svg>
